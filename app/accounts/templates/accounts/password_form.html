{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gerenciamento de senha do SojaCoin">
    <title>{% block title %}Senha{% endblock %} | SojaCoin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-white font-[Inter,system-ui,sans-serif] text-[#17211A] antialiased">
    <main class="box-border flex min-h-screen w-full items-center justify-center px-6 py-12 sm:px-20">
        <section class="box-border flex w-full max-w-[380px] flex-col gap-4">
            <div class="flex w-full items-center gap-[9px]" aria-label="SojaCoin">
                <div class="flex h-[30px] w-[30px] items-center justify-center rounded-[8px] bg-[#1E6B3C]" aria-hidden="true">
                    <span class="text-[15px] font-bold text-white">S</span>
                </div>
                <a href="{% url 'accounts:login' %}" class="text-[16px] font-bold tracking-[-0.3px]">SojaCoin</a>
            </div>

            <div class="h-[6px]" aria-hidden="true"></div>

            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
