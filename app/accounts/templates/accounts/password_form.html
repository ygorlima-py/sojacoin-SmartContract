{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gerenciamento de senha do SojaCoin">
    <title>{% block title %}{% translate "Senha" %}{% endblock %} {% translate "| SojaCoin" %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% url 'javascript-catalog' %}"></script>
</head>
<body class="min-h-screen bg-white font-[Inter,system-ui,sans-serif] text-[#17211A] antialiased">
    <main class="box-border flex min-h-screen w-full items-center justify-center px-6 py-12 sm:px-20">
        <section class="box-border flex w-full max-w-[380px] flex-col gap-4">
            <div class="flex w-full items-center">
                <a href="{% url 'accounts:login' %}" class="inline-flex items-center" aria-label="SojaCoin">
                    {% include "includes/brand_logo.html" with logo_class="h-[40px] w-auto object-contain" only %}
                </a>
            </div>
            {% include "includes/language_switcher.html" %}

            <div class="h-[6px]" aria-hidden="true"></div>

            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
