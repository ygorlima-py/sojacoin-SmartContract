{% extends 'accounts/password_form.html' %}
{% block title %}Verifique seu e-mail{% endblock %}
{% block content %}
<div>

    <p class="mt-1 text-[13px] leading-5 text-[#5C685E]">Se houver uma conta elegível para esse endereço, enviaremos as instruções de recuperação.</p>
</div>
<a href="{% url 'accounts:login' %}" class="flex h-[38px] items-center justify-center rounded-[8px] bg-[#1E6B3C] px-3.5 text-[13px] font-semibold text-white transition hover:bg-[#17552F]">Voltar ao login</a>
